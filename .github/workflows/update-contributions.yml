name: Update contributions SVG

on:
  schedule:
    - cron: '17 3 * * *' # daily at 03:17 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write # needed to push the regenerated SVG

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch contributions and generate SVG
        run: npm run update
        env:
          GH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GH_USERNAME: ${{ vars.GH_USERNAME || github.repository_owner }}

      - name: Commit and push if the SVG changed
        run: |
          if [ -z "$(git status --porcelain public/github-contributions.svg)" ]; then
            echo "SVG unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-contributions.svg
          git commit -m "chore: update contributions graph"
          git push
